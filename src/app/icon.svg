<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#1e293b"/>
  <!-- Paper body -->
  <rect x="6" y="4" width="13" height="17" rx="1.5" fill="#f1f5f9"/>
  <!-- Folded corner -->
  <path d="M15 4 L19 8 H15 V4Z" fill="#94a3b8"/>
  <!-- Paper lines -->
  <rect x="8" y="11" width="8" height="1.5" rx="0.75" fill="#94a3b8"/>
  <rect x="8" y="14" width="8" height="1.5" rx="0.75" fill="#94a3b8"/>
  <rect x="8" y="17" width="5" height="1.5" rx="0.75" fill="#94a3b8"/>
  <!-- Magnifying glass circle -->
  <circle cx="22" cy="23" r="5" stroke="#60a5fa" stroke-width="2.2" fill="none"/>
  <!-- Magnifying glass handle -->
  <line x1="25.5" y1="26.5" x2="28" y2="29" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Small highlight inside lens -->
  <circle cx="20.5" cy="21.5" r="1.2" fill="#60a5fa" fill-opacity="0.35"/>
</svg>
